# `main` is the release: every Mahfouz install pulls it at launch. So
# nothing gets there without these checks. See scripts/check.mjs and the
# README's "Releasing" section.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly: an artifact URL can stop resolving (or change) after it merged.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check diffs against origin/main, the release line.
          fetch-depth: 0

      # The Slidev plugin's floor (Vite and its plugins need 22.12+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Against main, not the PR's base: in a stack of PRs, a plugin that
      # isn't released yet needs no bump per PR, and a released one must
      # still go above main's version.
      - name: Manifests and version bumps
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check.mjs --base origin/main
          else
            node scripts/check.mjs
          fi

      # `npm ci` refuses a lockfile that doesn't match its package.json, which
      # is exactly what the plugin's install step would hit on users' machines.
      # --ignore-scripts: the lockfile is what's under test, not postinstall
      # downloads (e.g. playwright's browser).
      - name: Lockfiles
        run: |
          for lock in plugins/*/package-lock.json; do
            [ -e "$lock" ] || continue
            dir=$(dirname "$lock")
            echo "::group::npm ci in $dir"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            echo "::endgroup::"
          done

      # After the lockfiles: plugins' tests import their own npm
      # dependencies (the Slidev header/footer tests need markdown-it).
      - name: Tests
        run: npm test

      # On a PR: the artifacts of plugins whose manifest differs from main's.
      # On main and weekly: all of them.
      - name: Artifacts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check.mjs --artifacts --base origin/main
          else
            node scripts/check.mjs --artifacts
          fi

  # The mahfouz/encryption plugin's Rust sidecar. gpg and git-crypt come from
  # apt so the integration tests (real gpg in throwaway keyrings, and
  # byte-for-byte compatibility with the real git-crypt CLI) run instead of
  # skipping.
  encryption-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/encryption/sidecar
    steps:
      - uses: actions/checkout@v4

      - name: gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg gpg-agent git-crypt
          gpg --version | head -1
          git-crypt --version

      - name: Toolchain
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The mahfouz/excalidraw plugin's bundle. Its build is reproducible, so
  # building it from the lockfile must give the sha256 plugin.json pins:
  # the downloaded release asset is what this commit's sources build.
  excalidraw-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/excalidraw/bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      - name: Matches plugin.json
        run: |
          built=$(shasum -a 256 excalidraw-bundle.tar.gz | cut -d' ' -f1)
          pinned=$(node -p 'require("../plugin.json").install[0].artifacts.any.sha256')
          echo "built $built, pinned $pinned"
          if [ "$built" != "$pinned" ]; then
            echo "::error::the bundle builds to $built but plugin.json pins $pinned"
            exit 1
          fi
